<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus Timer Preview</title>
    <link rel="stylesheet" href="../shared-styles.css" />
    <style>
      body {
        background:
          radial-gradient(circle at top right, rgba(124, 58, 237, 0.15), transparent 28%),
          linear-gradient(180deg, #faf8ff, #f1ecfb);
      }
      .session-card,
      .checklist {
        padding: 16px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(136, 156, 178, 0.18);
        box-shadow: 0 16px 30px rgba(15, 23, 42, 0.06);
      }
      .session-label {
        display: inline-flex;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(124, 58, 237, 0.12);
        color: #7c3aed;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .session-title {
        margin: 10px 0 4px;
        font-size: 24px;
        font-weight: 800;
        color: #241648;
      }
      .session-meta {
        color: #645c82;
        font-size: 13px;
      }
      .checklist {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .check-item {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 14px;
        color: #2d254a;
      }
      .check-mark {
        width: 22px;
        height: 22px;
        border-radius: 8px;
        display: inline-grid;
        place-items: center;
        font-size: 12px;
        font-weight: 800;
      }
      .check-done .check-mark {
        background: rgba(16, 185, 129, 0.14);
        color: #0f766e;
      }
      .check-pending .check-mark {
        background: rgba(124, 58, 237, 0.12);
        color: #7c3aed;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
