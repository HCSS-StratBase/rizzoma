<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes Scratchpad Preview</title>
    <link rel="stylesheet" href="../shared-styles.css" />
    <style>
      body {
        background:
          radial-gradient(circle at top right, rgba(220, 38, 38, 0.12), transparent 32%),
          linear-gradient(180deg, #fdf8f7, #f8eeec);
      }
      .scratchpad {
        display: grid;
        grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
        gap: 16px;
        flex: 1;
      }
      .notes-panel,
      .checklist-panel {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 16px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(176, 136, 132, 0.22);
        box-shadow: 0 14px 28px rgba(60, 20, 20, 0.06);
      }
      .panel-title {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #7a2c24;
      }
      .note {
        padding: 12px 12px 13px;
        border-radius: 12px;
        background: linear-gradient(180deg, rgba(253, 248, 247, 0.98), rgba(247, 233, 230, 0.96));
        border: 1px solid rgba(189, 143, 138, 0.22);
        color: #3d1814;
        font-size: 13px;
        line-height: 1.5;
      }
      .checklist-item {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 8px 10px;
        border-radius: 10px;
        background: rgba(253, 248, 247, 0.86);
        border: 1px solid rgba(189, 143, 138, 0.18);
        color: #3d1814;
        font-size: 13px;
        line-height: 1.45;
      }
      .checklist-item.done {
        opacity: 0.55;
        text-decoration: line-through;
      }
      .check-box {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        border-radius: 4px;
        border: 1.5px solid #b87068;
        background: rgba(255, 255, 255, 0.86);
        color: #7a2c24;
        font-size: 11px;
        font-weight: 700;
        flex: 0 0 auto;
      }
      .checklist-item.done .check-box {
        background: #c94b3f;
        border-color: #a03a2f;
        color: #fff;
      }
      @media (max-width: 760px) {
        .scratchpad { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
